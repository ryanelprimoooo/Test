<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Sports Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .tracker-card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
        }
        h1 { font-size: 1.5rem; margin-bottom: 20px; color: #38bdf8; }
        .stat-box { margin-bottom: 25px; }
        .number { font-size: 2.5rem; font-weight: bold; color: #f59e0b; font-variant-numeric: tabular-nums; }
        .label { font-size: 0.9rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="tracker-card">
        <h1>Ovechkin All-Time Goals Tracker</h1>
        
        <div class="stat-box">
            <div id="goals-left" class="number">--</div>
            <div class="label">Goals needed to break Gretzky's Record</div>
        </div>

        <div class="stat-box">
            <div id="salary-ticking" class="number">$0.00</div>
            <div class="label">Estimated salary earned today (Live)</div>
        </div>
    </div>

    <script>
        // Static tracker data (Update this manually when he scores)
        const gretzkyRecord = 894;
        const currentOvechkinGoals = 868; // Example number
        document.getElementById('goals-left').innerText = (gretzkyRecord + 1) - currentOvechkinGoals;

        // Live Ticking Logic (Simulating salary earned per second today)
        const dailySalary = 46000; // Example daily breakdown of an NHL star
        const salaryPerSecond = dailySalary / 86400;
        
        // Find out how many seconds have passed today
        const now = new Date();
        const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        let secondsPassedToday = Math.floor((now - startOfDay) / 1000);
        let currentEarnings = secondsPassedToday * salaryPerSecond;

        // Update the counter on screen every 100 milliseconds
        setInterval(() => {
            currentEarnings += (salaryPerSecond / 10);
            document.getElementById('salary-ticking').innerText = '$' + currentEarnings.toFixed(2);
        }, 100);
    </script>

</body>
</html>
